<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CoronaS3DLab a Napoli. Contatti, email e Instagram.">
  <title>CoronaS3DLab | Napoli</title>
  <style>
    :root { color-scheme: dark; --accent:#79f2c0; --panel:#161b22; --muted:#a9b1ba; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(circle at top,#253342 0,#0d1117 58%); color:#fff; }
    main { width:min(100%,620px); padding:48px 36px; border:1px solid #30363d; border-radius:24px; background:rgba(22,27,34,.92); box-shadow:0 24px 80px rgba(0,0,0,.45); text-align:center; }
    h1 { margin:0 0 8px; font-size:clamp(2.2rem,8vw,4rem); letter-spacing:-.05em; }
    .tagline { margin:0 0 34px; color:var(--muted); font-size:1.1rem; }
    .contacts { display:grid; gap:14px; }
    a,.location { display:block; padding:15px 18px; border:1px solid #30363d; border-radius:14px; color:#fff; text-decoration:none; background:#0d1117; transition:.2s ease; }
    a:hover { border-color:var(--accent); color:var(--accent); transform:translateY(-2px); }
    .label { display:block; margin-bottom:4px; color:var(--muted); font-size:.78rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    footer { margin-top:30px; color:#7d8590; font-size:.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>CoronaS3DLab</h1>
    <p class="tagline">Creatività e stampa 3D a Napoli</p>
    <section class="contacts" aria-label="Contatti">
      <a href="tel:+393347441844"><span class="label">Telefono</span>+39 334 744 1844</a>
      <a href="mailto:coronas3dlab@gmail.com"><span class="label">Email</span>coronas3dlab@gmail.com</a>
      <a href="https://www.instagram.com/coronas3dlab/" target="_blank" rel="noopener noreferrer"><span class="label">Instagram</span>@coronas3dlab</a>
      <div class="location"><span class="label">Città</span>Napoli</div>
    </section>
    <footer>&copy; 2026 CoronaS3DLab</footer>
  </main>
</body>
</html>
